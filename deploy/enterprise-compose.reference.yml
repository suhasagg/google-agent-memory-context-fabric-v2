services:
 postgres:
  image: postgres:16-alpine
  environment: {POSTGRES_DB: memory, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
  ports: ["5432:5432"]
  healthcheck: {test: ["CMD-SHELL","pg_isready -U postgres -d memory"], interval: 3s, timeout: 3s, retries: 30}
 redis: {image: "redis:7-alpine", ports: ["6379:6379"]}
 qdrant: {image: "qdrant/qdrant:latest", ports: ["6333:6333"]}
 neo4j:
  image: neo4j:5-community
  environment: {NEO4J_AUTH: neo4j/password123}
  ports: ["7474:7474","7687:7687"]
 redpanda:
  image: redpandadata/redpanda:latest
  command: ["redpanda","start","--overprovisioned","--smp","1","--memory","512M","--reserve-memory","0M","--node-id","0","--check=false","--kafka-addr","PLAINTEXT://0.0.0.0:9092","--advertise-kafka-addr","PLAINTEXT://redpanda:9092"]
  ports: ["9092:9092"]
 api:
  build: .
  env_file: .env
  ports: ["8000:8000"]
  depends_on:
   postgres: {condition: service_healthy}
